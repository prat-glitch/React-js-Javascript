<!DOCTYPE html>
<html lang="en">
<head>

  <title>Offline - Samlap</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0b141a;
      background-image: radial-gradient(circle at top, #15222b 0%, #0b141a 100%);

      line-height: 1.5;

      background-color: #4F46E5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 500;
